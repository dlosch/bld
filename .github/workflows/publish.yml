name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers when you publish a new Release in GitHub
  # Alternatively, uncomment below to trigger on manual workflow dispatch:
  # workflow_dispatch: 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Match this to your project

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build bld/bld.csproj --configuration Release --no-restore

    - name: Pack project
      run: dotnet pack bld/bld.csproj --configuration Release --no-build --output ./nupkg
      # If you want to use the GitHub Release tag as the version, you can pass it like this:
      # run: dotnet pack --configuration Release -p:Version=${{ github.event.release.tag_name }} --output ./nupkg

    - name: Upload nupkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: ./nupkg/*.nupkg

    # Trusted publishing: exchange the GitHub OIDC token (id-token: write above) for a
    # short-lived NuGet API key, so no long-lived NUGET_API_KEY secret is needed.
    # Requires a trusted publishing policy on nuget.org for this package, bound to this
    # repository and workflow.
    - name: NuGet login (OIDC)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        # The account that CREATED the trusted publishing policy, not the package owner
        # organisation ("cloudsider") - the token exchange matches on the policy creator.
        user: dlosch

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
