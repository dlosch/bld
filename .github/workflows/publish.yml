name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers when you publish a new Release in GitHub
  # Alternatively, uncomment below to trigger on manual workflow dispatch:
  # workflow_dispatch: 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Match this to your project

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build bld/bld.csproj --configuration Release --no-restore

    - name: Pack project
      run: dotnet pack bld/bld.csproj --configuration Release --no-build --output ./nupkg
      # If you want to use the GitHub Release tag as the version, you can pass it like this:
      # run: dotnet pack --configuration Release -p:Version=${{ github.event.release.tag_name }} --output ./nupkg

    - name: Push to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
