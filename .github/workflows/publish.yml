name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers when you publish a new Release in GitHub
  # Alternatively, uncomment below to trigger on manual workflow dispatch:
  # workflow_dispatch: 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Match this to your project

    # The version lives only in bld/bld.csproj (see .claude/skills/release). A release tag that
    # does not match it would push a package under a different number than the tag claims, so a
    # mismatch stops the run before anything is built.
    - name: Check that the release tag matches the project version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' bld/bld.csproj)
        if [ "$version" != "$TAG" ]; then
          echo "Release tag '$TAG' does not match <Version>$version</Version> in bld/bld.csproj."
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore bld.slnx

    - name: Build
      run: dotnet build bld.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test bld.slnx --configuration Release --no-build

    - name: Pack project
      run: dotnet pack bld/bld.csproj --configuration Release --no-build --output ./nupkg

    - name: Upload nupkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: ./nupkg/*.nupkg

    # Trusted publishing: exchange the GitHub OIDC token (id-token: write above) for a
    # short-lived NuGet API key, so no long-lived NUGET_API_KEY secret is needed.
    # Requires a trusted publishing policy on nuget.org for this package, bound to this
    # repository and workflow.
    - name: NuGet login (OIDC)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        # The nuget.org account that created the trusted publishing policy. It must be the
        # account that owns dotnet-bld, since a policy only covers packages owned by its owner.
        user: cloudsider

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
