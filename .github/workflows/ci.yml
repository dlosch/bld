name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore bld.slnx

    - name: Build
      run: dotnet build bld.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test bld.slnx --configuration Release --no-build
